<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0f0f1a;overflow:hidden;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#fff;}
svg#main-svg{display:block;position:absolute;top:56px;left:0;right:0;bottom:80px;}

/* === TOP BAR === */
#topbar{
  position:absolute;top:0;left:0;right:0;height:56px;z-index:100;
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  background:rgba(10,10,26,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.title-area{display:flex;flex-direction:column;}
.title-area h1{font-size:17px;font-weight:600;letter-spacing:0.5px;color:rgba(255,255,255,0.9);}
.title-area .sub{font-size:11px;font-weight:400;opacity:0.4;margin-top:1px;}
.search-area{position:relative;width:280px;}
.search-area input{
  width:100%;padding:8px 14px 8px 36px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.06);color:#fff;font-size:13px;outline:none;
  transition:border-color 0.2s,background 0.2s;
}
.search-area input:focus{border-color:rgba(255,255,255,0.25);background:rgba(255,255,255,0.1);}
.search-area input::placeholder{color:rgba(255,255,255,0.3);}
.search-area svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:0.3;}
.controls-area{display:flex;gap:6px;align-items:center;}
.controls-area button{
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);
  color:#fff;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:background 0.2s;
}
.controls-area button:hover{background:rgba(255,255,255,0.15);}

/* === LEGEND & FILTERS === */
#legend{
  position:absolute;bottom:96px;left:16px;z-index:100;
  background:rgba(10,10,26,0.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);
}
.filter-btn{
  display:flex;align-items:center;gap:8px;padding:5px 8px;margin:3px 0;
  background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;
  font-size:12px;color:rgba(255,255,255,0.85);transition:all 0.2s;width:100%;text-align:left;
}
.filter-btn:hover{background:rgba(255,255,255,0.05);}
.filter-btn .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;transition:opacity 0.2s;}
.filter-btn .count{margin-left:auto;opacity:0.35;font-size:11px;}
.filter-btn.inactive .dot{opacity:0.2;}
.filter-btn.inactive{opacity:0.35;}

/* === SIDE PANEL === */
#panel{
  position:absolute;top:56px;right:0;bottom:80px;width:380px;z-index:90;
  background:rgba(10,10,26,0.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-left:1px solid rgba(255,255,255,0.08);
  transform:translateX(100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
  overflow-y:auto;padding:24px 20px;
}
#panel.open{transform:translateX(0);}
#panel::-webkit-scrollbar{width:4px;}
#panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
.panel-close{
  position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.08);
  border:none;color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;
  font-size:16px;display:flex;align-items:center;justify-content:center;transition:background 0.2s;
}
.panel-close:hover{background:rgba(255,255,255,0.15);}
.panel-badge{
  display:inline-block;padding:3px 10px;border-radius:4px;font-size:10px;
  font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;
}
#panel h2{font-size:20px;font-weight:700;margin-bottom:4px;line-height:1.3;}
.panel-period{font-size:12px;opacity:0.4;margin-bottom:12px;display:block;}
.panel-desc{font-size:13.5px;line-height:1.6;opacity:0.8;margin-bottom:16px;}
.panel-quote{
  font-style:italic;font-size:13px;line-height:1.5;opacity:0.65;
  border-left:2px solid rgba(255,255,255,0.15);padding-left:12px;margin-bottom:16px;
}
.panel-section{margin-bottom:16px;}
.panel-section h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;opacity:0.4;margin-bottom:8px;font-weight:600;}
.panel-section ul{list-style:none;padding:0;}
.panel-section li{font-size:13px;line-height:1.5;opacity:0.75;padding:2px 0;padding-left:12px;position:relative;}
.panel-section li::before{content:'·';position:absolute;left:0;opacity:0.4;}

/* === TIMELINE === */
#timeline{
  position:absolute;bottom:0;left:0;right:0;height:80px;z-index:100;
  background:rgba(10,10,26,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,255,255,0.06);
}
#timeline svg{width:100%;height:100%;}
#timeline .axis text{fill:rgba(255,255,255,0.35);font-size:11px;}
#timeline .axis line,#timeline .axis path{stroke:rgba(255,255,255,0.08);}
#timeline .brush .selection{fill:rgba(255,255,255,0.08);stroke:rgba(255,255,255,0.2);stroke-width:1;rx:4;}
#timeline .brush .handle{fill:rgba(255,255,255,0.4);rx:2;width:4px !important;}
#timeline .brush .overlay{fill:transparent;}
.timeline-label{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);
  font-size:11px;opacity:0.4;letter-spacing:0.5px;pointer-events:none;
}
.play-btn{
  position:absolute;top:10px;right:20px;z-index:10;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
  color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all 0.2s;
  font-size:14px;
}
.play-btn:hover{background:rgba(255,255,255,0.18);}
.play-btn.playing{background:rgba(42,157,143,0.25);border-color:rgba(42,157,143,0.5);}
.timeline-year{
  position:absolute;top:8px;right:60px;
  font-size:13px;font-weight:600;opacity:0;letter-spacing:0.5px;
  transition:opacity 0.2s;pointer-events:none;
}
.timeline-year.visible{opacity:0.6;}

/* === TOOLTIP === */
.tooltip{
  position:absolute;pointer-events:none;opacity:0;z-index:200;
  background:rgba(10,10,30,0.94);color:#fff;padding:5px 10px;
  border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap;
  border:1px solid rgba(255,255,255,0.12);
  border-left:3px solid rgba(255,255,255,0.12);
  box-shadow:0 4px 18px rgba(0,0,0,0.5);
  transition:opacity 0.12s;
}

/* === ANIMATIONS === */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn 0.4s ease-out;}
@keyframes ringPulse{0%,100%{stroke-opacity:0.65;stroke-width:2;}50%{stroke-opacity:0.25;stroke-width:3.5;}}
.ring-pulse{animation:ringPulse 2s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0.06;}50%{opacity:0.32;}}
.star-twinkle{animation:twinkle 4.5s ease-in-out infinite;}

</style>

const details = {
  'a01':{desc:"Hugues Aubin, fonctionnaire territorial à la ville de Rennes pendant 24 ans, autodidacte du numérique depuis 1993-95, est le visionnaire du LabFab étendu. Il retrace la préhistoire du mouvement (cantine numérique de Paris, parrainage, FING), la rencontre fondatrice avec John Le Jeune (oscilloscope open source, Arduino, TV-B-Gone aux Trois-Soleils), la construction collective du premier lieu à l'EESAB, et le développement du réseau. Sa vision du LabFab étendu, inspirée de la Fab City de Thomas Diaz, en fait l'architecte conceptuel du modèle rennais. Entretien fleuve (~1h42) d'une densité exceptionnelle.",role:["Visionnaire : LabFab étendu, Fab City, communs opérants","Catalyseur de rencontres et de projets","Co-fondateur de My Human Kit avec Nicolas Huchet","Porteur politique du projet auprès des institutions"],sources:["Interview directe (1h42)","Cité dans 8/12 interviews"]},
  'a02':{desc:"Baptiste Gaultier, ingénieur télécom/réseau à l'IMT (ex-Télécom Bretagne) depuis 2009, développe des prototypes d'objets connectés. Il raconte sa découverte du mouvement FabLab par la rencontre avec John Le Jeune, qui pose un Arduino sur son bureau alors qu'il travaille sur le suivi de consommation électrique d'un bâtiment (IPv6 sur microcontrôleurs contraints) — « ça a changé ma vie ». Il retrace la généalogie du concept (Jardin Numérique au Jardin Moderne en 2011, transmission Barcelone-IAAC → Toulouse-Artilect → Rennes via John et Snootlab), la genèse du premier FabLab rennais à l'EESAB (février 2012, ateliers Arduino sur table de ping-pong), puis sa décennie consacrée aux MOOC FabLab sur France Université Numérique (à partir de 2014), avec une tournée des lieux bretons puis franciliens. Il porte un regard d'« informaticien venu à la matière » — « maker par une belle surprise » — et documente l'effervescence nationale (FabX, Fab Foundation) comme le moment de flottement où tout le monde se revendique FabLab (appel à projets Fleur Pellerin, Carrefour).",role:["Expertise technique (Arduino, électronique, prototypage)","Animation des premiers ateliers à l'EESAB","Création des MOOC FabLab (FUN, 2014)","Voyages internationaux (MIT, Vietnam)"],sources:["Interview directe","Cité dans 6/12 interviews"]},
  'a03':{desc:"Nicolas Huchet, mécanicien ajusteur de formation (Compagnons du Devoir), raconte sa découverte fortuite du FabLab en octobre 2012 lors de l'événement Vivacité, motivée par un besoin concret : sa prothèse de main défaillante. De cette rencontre naît le projet Bionico (main bionique open source basée sur InMoov), puis l'association My Human Kit. L'entretien retrace son passage de simple usager à figure publique internationale, ses voyages, les tensions avec BUG, et sa vision des FabLabs ancrée dans l'éducation populaire.",role:["Incarnation de l'impact transformateur du FabLab","Fondateur de My Human Kit et du projet Bionico","Médiatisation majeure (France 2, international)","Défenseur de l'éducation populaire et de l'empowerment"],sources:["Interview directe","Cité dans 4/12 interviews"]},
  'a04':{desc:"Norbert Friant, responsable numérique à Rennes Métropole depuis 2002, est l'un des architectes institutionnels du LabFab. Il retrace avec précision la chronologie 2010-2017 : des premiers événements au montage de l'association, en passant par l'appel à projet national 2013 et la controverse BUG (300K€ non redistribués). Il dresse des portraits nuancés des acteurs clés et défend une vision du FabLab comme outil d'éducation populaire, de transmission intergénérationnelle et de souveraineté locale, en opposition au modèle Smart City.",role:["Portage institutionnel depuis Rennes Métropole","Assembleur d'acteurs hétérogènes","Référent régional au RFF Lab","Défenseur du modèle bottom-up et de l'éducation populaire"],sources:["Interview directe","Cité dans 4/12 interviews"]},
  'a05':{desc:"Erwan Mahé, fondateur d'Artefacto et professeur d'enseignement artistique à l'EESAB, est à l'origine du premier FabLab rennais. Il raconte comment son besoin concret d'un atelier de fabrication numérique partagé — sans intention initiale de s'inscrire dans le mouvement FabLab — a rencontré les visions de Norbert Friant et Hugues Aubin pour donner naissance au LabFab. L'entretien met en lumière une genèse pragmatique, l'impact transformateur du cas Nicolas Huchet, et une conviction forte sur la dimension humaine comme clé de pérennité.",role:["Propose et obtient le local à l'EESAB","Monte des formations numériques (DNAT, licence pro, master)","Crée le laboratoire Design et Pratiques Numériques","Assure la pérennité du FabLab dans l'ADN de l'école"],sources:["Interview directe","Cité dans 3/12 interviews"]},
  'a06':{desc:"Bérangère Amiot, designer freelance diplômée de l'EESAB (2012), raconte son parcours atypique (infocom, sociologie, Beaux-Arts) et son entrée dans le LabFab par la rencontre avec Erwan Mahé et Baptiste Gaultier. Elle est devenue la première femme présidente du réseau LabFab. L'entretien aborde en profondeur le design collaboratif, la facilitation de hackathons, la tension entre bénévolat et salariat, la place des femmes, et une vision radicale d'avenir (open source, low-tech, documentation, médiathèques).",role:["Co-présidente de l'association LabFab (avec Tony)","Facilitation de hackathons et marathons créatifs","Défense de l'open source, la documentation et la low-tech","Voix critique sur la parité et le bénévolat"],sources:["Interview directe","Citée dans 4/12 interviews"]},
  'a07':{desc:"Romain Chefdor, chargé de mission numérique à Rennes Métropole et urbaniste de formation, retrace son parcours depuis le syndicat mixte Manche Numérique (Manche Lab, FabLab mobile lauréat de l'appel à projet Pellerin 2013) jusqu'à son arrivée à Rennes en 2017. Il occupe un rôle de facilitateur du réseau LabFab (passage de 7 à 23 lieux) et siège au conseil d'administration du réseau français des FabLabs (RFF Lab) depuis 2022. L'entretien est le plus riche sur les dimensions institutionnelles, le RFF Lab, la structuration nationale, et les tensions entre esprit punk et institutionnalisation.",role:["Facilitateur du réseau (passage de 7 à 23 lieux)","Lien entre LabFab et politiques publiques","Animation de projets (Sensor Community, Métromix, MobiLab)","Représentant au CA du RFF Lab"],sources:["Interview directe","Cité dans 2/12 interviews"]},
  'a08':{desc:"Figure fondatrice du LabFab rennais. Transmetteur de compétences techniques (Arduino) et de valeurs du libre. Travaillait chez Snootlab/Bearsteak, revendeur Arduino open source. Embauché par l'EESAB, il en fut le premier fab manager.",role:["Apporte l'Arduino et la culture open source à Rennes","Fournit le matériel et l'expertise technique de départ","Anime les premiers ateliers avec Baptiste Gaultier","Premier fab manager du LabFab EESAB","Transmetteur de valeurs fondatrices"],sources:["Jamais interviewé","Cité dans 5/12 interviews comme « barycentre absent »"],quote:"« Cette carte Arduino m'a intrigué. » — Hugues Aubin"},
  'a09':{desc:"Responsable de l'association BUG. Rôle fondateur dans l'infrastructure du LabFab (site wiki, événements, nom « LabFab ») mais aussi source de tensions sur la gestion des financements 2013.",role:["Création du site wiki LabFab","Proposition du nom « LabFab » (influence québécoise)","Organisation de Vivacité (60 000 visiteurs)","Porteur administratif de l'appel à projet Pellerin"],sources:["Jamais interviewé","Cité dans 5/12 interviews"]},
  'a10':{desc:"Membre de l'EESAB. A soutenu l'idée de mettre à disposition des étudiants en design de nouveaux matériaux d'expérimentation.",role:["Soutien à l'ouverture du lieu à l'EESAB","Vision pédagogique : nouveaux outils pour le design"],sources:["Citée dans 2/12 interviews"]},
  'a11':{desc:"Habitant rennais, pionnier du low-tech. Seul citoyen non-institutionnel autour de la table fondatrice du LabFab.",role:["Seul habitant à la table fondatrice","Pionnier du low-tech dans le réseau"],sources:["Cité dans 3/12 interviews"]},
  'a12':{desc:"Promoteur international du concept de Fab City. Son TEDx dénonçant le modèle PITO (Product In, Trash Out) a été un tournant dans la vision de Hugues Aubin.",role:["Inspiration directe du concept de LabFab étendu","TEDx fondateur sur la Fab City et le modèle PITO"],sources:["Cité dans 1/12 interviews"]},
  'a13':{desc:"Membre actif du LabFab lié à l'IMT. Voyages internationaux avec Nicolas Huchet (Russie). Impliqué dans des projets européens.",role:["Voyages internationaux pour le LabFab","Projets européens avec le RFF Lab"],sources:["Cité dans 2/12 interviews"]},
  'a14':{desc:"Tony Vanpoucke, fab manager de l'EduLab Rennes 2 depuis 2017 et co-président de l'association LabFab, retrace un parcours d'artiste devenu professionnel de la médiation. Formé en arts plastiques à l'Université catholique de l'Ouest (Angers) puis en master ATN / Création numérique à Rennes 2 (arrivée en 2012), il découvre les FabLabs en spectateur, au moment même de l'« ébullition » rennaise. C'est l'association Milo Carré (?) (art numérique pour enfants) qui l'oblige à basculer dans la technique : auto-formation à Arduino, résidences d'entraide, formations du LabFab animées par Hugues Aubin et Erwan Mahé. Installé au Grand Cordel, il bénéficie directement de la politique d'équipement des EPN — c'est-à-dire du LabFab étendu.<br><br>Il entre à l'EduLab en 2017, sur un poste financé par le FEDER, dans un contexte tendu : le projet, initié par Pascal Plantard, Anthony Offray (?), David Puzos (?) et le LabFab lui-même, a concentré sur un seul lieu un financement pensé pour en équiper plusieurs. Il hérite de l'étiquette « Rennes 2 a pris la part du gâteau » et raconte le travail patient de réinsertion dans le réseau — dont l'épisode fondateur du barbecue des fab managers, où Pascal Plantard l'envoie en lui disant « c'est les copains ».<br><br>L'entretien déroule ensuite trois massifs : le <strong>Covid</strong> comme moment de révélation de la communauté souterraine (visio à 200 personnes, Slack, réseau de collecte de visières, Couturiers masqués) ; la <strong>géographie des réseaux</strong> (réseau breton historique LabBZH (?), MIBS en Bretagne Sud, absorption par le RFFLabs, logique rhizomatique commune aux usagers et aux institutionnels) ; et une <strong>vision à dix ans</strong> structurée par le livre blanc des FabLabs — institutionnalisation déjà accomplie, infusion des low-tech comme méthodologie, permanence de la documentation malgré l'IA, convergence possible avec les tiers-lieux.",role:["Fab manager de l'EduLab Rennes 2, recruté sur le poste FEDER en 2017","Co-président de l'association LabFab (avec Bérangère Amiot)","Chantier du site du LabFab : d'un site vitrine vers un site d'usage, « la place publique » du réseau","Coordination Covid : infographie nationale des modèles de collecte de visières de l'Ouest","Projets d'ouverture des étudiants : Erlangen, FabLab étudiant à l'Opéra","Recherche personnelle sur l'histoire du LabFab (article Wikipédia, réseau breton)","Mentor d'Alma sur 10 ans : deux lettres de recommandation, recrutement direct comme monitrice"],sources:["Interview directe (1 h 50)","Cité dans 6 autres interviews"],quote:"« C'est quand j'ai commencé à faire une doc que je me suis dit : ça y est, j'ai repartagé un truc, donc je peux être identifié comme un gars qui participe à ce mouvement-là. »"},
  'a15':{desc:"Célia Guye, designer de formation (DNSEP design d'objets-espaces à l'EESAB de Rennes, 2020), est fab manager à l'École des Beaux-Arts de Rennes (EESAB). Son parcours est tout entier traversé par le croisement FabLab / handicap : stages à l'Albi Lab et au ReHab-Lab d'un centre de rééducation à Albi, premier hackathon au Fabricarium, hackathons My Human Kit (dont Focus Vision à Pasteur en 2020), résidence artistique post-diplôme, puis poste de fab manager dans l'asso parisienne Le Polès (FabLab de Villeneuve-la-Garenne) — un projet de remobilisation de jeunes déscolarisés sur 3 mois, dans un dispositif à six FabLabs où elle a succédé à Camille Bisson. Elle revient à Rennes après la fin de cet appel à projet. En parallèle, elle maintient une pratique de design dans le handicap avec le collectif Studio Stimuli. L'entretien déroule sa vision des FabLabs (lieux humanistes, non-hiérarchiques, mixtes), son rapport au réseau (RFFLabs, OctobreMake, LabFab) et sa projection sur l'avenir des FabLabs comme lieux de solutions face aux crises écologiques et sanitaires.",role:["Fab manager du LabFab EESAB (succède à John Le Jeune et Théo)","Parcours FabLab / handicap (My Human Kit, Studio Stimuli)","Expérience Le Polès : remobilisation de jeunes déscolarisés","Mobilité professionnelle au Portugal (RFFLabs)"],sources:["Interview directe","Citée dans Interview Erwan Mahé"],quote:"Tout le monde est impliqué : même si tu n'es pas l'expert, tu te sens intégré parce que tu es porteur de projet."},
  'a16':{desc:"Laurent Mattlé découvre les FabLabs au TMP/Lab d'Ivry-sur-Seine avant d'arriver à Rennes en juillet 2011. Connecté à Hugues Aubin via Anthony Cocherie (BUG), il participe dès les premières réunions fondatrices et aide à l'installation du FabLab à l'EESAB. En 2013, il part au Vietnam avec Baptiste Gaultier et Mariame Labidi pour ouvrir le premier FabLab du pays à Huế, puis contribue à l'ouverture du second à Hô-Chi-Minh-Ville. En 2016, il devient Fab Manager du Teaching Lab (SPI, Université Bretagne-Loire), où il déploie des actions locales, régionales (Lab Tour) et internationales (FabLab en Côte d'Ivoire). Son interview est un témoignage de parcours complet : du premier contact maker parisien à une vision prospective du FabLab comme outil de médiation, d'engagement citoyen et de transition.",role:["Aide à l'installation du FabLab EESAB (2011-2012)","Workshop inaugural au Vietnam — ouverture du 1er FabLab à Huế (2013)","Fab Manager du Teaching Lab (SPI, Université Bretagne-Loire) de 2016 à 2021","Organisateur du Lab Tour dans les universités UBL","Accompagnement UVCI (Côte d'Ivoire) pour créer un FabLab"],sources:["Interview directe"]},
  'a17':{desc:"Jean-Baptiste Le Clec'h, ancien étudiant en master TEF (sciences de l'éducation, Rennes 2), raconte son entrée dans le mouvement des makers en 2012 via un mémoire de recherche-action sur la reconnaissance des compétences hors diplôme. Voyage à San Francisco, rencontre avec Dale Dougherty et Sherry Huss, importation de Maker Faire en France, perte de la licence au profit de Leroy Merlin (2016), puis création de l'agence Make Me avec Jean-Marc. Depuis le Grand 8 à Rennes, il organise le Maker Campus (plus grand rassemblement de makers en France, 600 makers/édition, 8 000 accueillis au total), tout en ouvrant un Lab au public. L'entretien livre un regard extérieur-intérieur sur le LabFab rennais : la stratégie décentralisée de Rennes a créé une culture maker profonde, le public cherche d'abord à apprendre, et l'avenir passe par la transition écologique.",role:["Organisateur Maker Faire France (10 éditions)","Co-fondateur Make Me avec Jean-Marc","Créateur du Maker Campus (plus grand rassemblement de makers de France)"],sources:["Interview directe","Cité dans plusieurs interviews"],quote:"En 2012 je trouvais la stratégie décentralisée de Rennes dommage. En 2026, je trouve que c'était très très bien. 14 ans après, je vois toutes ces graines qui ont germé."},
  'a18':{desc:"Co-fondateur de Make Me avec JB Le Clec'h. Ancien partenaire de groupe de rock. Organisent ensemble le Maker Campus, Tech in Vitré, Maker Music Festival.",role:["Co-fondateur Make Me"],sources:["Interview JB Le Clec'h"]},
  'a19':{desc:"Camille Bisson, designer de formation (lycée Brickini, DSA), est responsable du Teaching Lab, FabLab de l'Université de Rennes rattaché au SUPTICE, sur le campus de Beaulieu. Après des expériences chez un ébéniste, en packaging, comme responsable innovation à la SNCF et un an dans un FabLab associatif en région parisienne (remobilisation de jeunes en quartiers populaires), elle arrive à Rennes en 2021. L'entretien révèle un positionnement singulier dans le réseau : le Teaching Lab est massivement tourné vers l'enseignement (100h+/an), la co-conception de matériel pédagogique avec les enseignants, et l'accueil de classes entières — une pratique peu courante dans les autres FabLab. Camille détaille des projets emblématiques (piège à drosophiles avec ECOBIO, hackathon plancton, accueil d'un IME) et porte une vision forte : le FabLab comme espace de sensibilisation au faire, de retrouvaille avec l'esprit logique, et de lien humain face à la dématérialisation.",role:["Fab manager du Teaching Lab (depuis 2021, succède à Laurent Mattlé)","Co-conception de matériel pédagogique","Enseignement au FabLab (100h+/an)","Projets emblématiques : piège à drosophiles (ECOBIO), hackathon plancton"],sources:["Interview directe"],quote:"L'essence de ce que je fais, c'est pas d'apprendre à utiliser l'impression 3D, c'est apprendre à faire toi-même."},
  'a20':{desc:"Professeur à l'Université Rennes 2, spécialiste en sciences de l'éducation. Fondateur de l'EduLab Rennes 2 en 2017. A recruté Tony Vanpoucke comme fab manager en CDI.",role:["Fondateur de l'EduLab Rennes 2 (2017)","Recruteur de Tony Vanpoucke"],sources:["Information transmise par Axel Ropert"]},
  'a21':{desc:"Sculpteur numérique français. Créateur d'InMoov, le premier robot humanoïde open source entièrement imprimé en 3D. Sa main InMoov, découverte sur Thingiverse par Hugues Aubin, est à l'origine du projet Bionico de Nicolas Huchet.",role:["Créateur d'InMoov (robot open source)","Inspirateur indirect du projet Bionico"],sources:["Cité dans Interview Nicolas Huchet","Cité dans Interview JB Le Clec'h"]},
  'a22':{desc:"Fondateur de Maker Faire et du magazine Make. Figure fondatrice du mouvement maker mondial. Rencontré par JB Le Clec'h à San Francisco en 2011.",role:["Fondateur de Maker Faire","Influence mondiale sur le mouvement maker"],sources:["Interview JB Le Clec'h"]},
  'a23':{desc:"Co-fondatrice de Maker Faire avec Dale Dougherty. Amie proche de JB Le Clec'h. A observé la spécificité française du design dans le mouvement maker.",role:["Co-fondatrice de Maker Faire","Observatrice internationale du mouvement maker"],sources:["Interview JB Le Clec'h"],quote:"Les makers français pensent le design dès le départ, contrairement aux autres pays."},
  'a24':{desc:"Jeune maker autodidacte (pseudo Marc Gyver). Fabrique des voitures électriques et des vélos, activité devenue son business. Illustration de la reconnaissance des compétences hors diplôme — question de recherche initiale de JB Le Clec'h.",role:["Maker autodidacte","Figure de l'empowerment par le faire"],sources:["Interview JB Le Clec'h"]},
  'a25':{desc:"Alma, ancienne étudiante de l'Université Rennes 2, est facilitatrice numérique à l'EduLab Pasteur (FabLab municipal de la ville de Rennes, ouvert en 2021) depuis septembre 2024. Son parcours dans les FabLab se déroule en trois temps : usagère à l'EduLab Rennes 2 dès 2018 (projet associatif de théâtre, premières impressions laser avec Tony Vanpoucke), monitrice étudiante pendant son master création numérique (1ʳᵉ génération), puis facilitatrice à Pasteur après une année dans les bibliothèques de la ville. Elle est aussi artiste-auteur indépendante — « multicasquette culturelle » entre art, technologie et recherche, travaillant avec Immersia/IRISA et l'INSA. L'entretien met en avant la posture singulière de l'EduLab Pasteur (gratuité, public enfance, médiation nature & numérique avec les centres de loisirs, brassement social fort) et la trajectoire affective d'Alma autour de Tony Vanpoucke comme référent qui « a changé sa trajectoire de vie ». Elle se positionne comme militante non pas pour l'open source ou la communauté maker, mais pour l'accessibilité numérique aux publics précaires.",role:["Facilitatrice numérique à l'EduLab Pasteur (depuis 2024)","Ex-monitrice à l'EduLab Rennes 2 (master création numérique)","Artiste-auteur indépendante (Immersia, IRISA, INSA)","Médiation enfance et croisement nature & numérique"],sources:["Interview directe"],quote:"Un lieu qui a d'un coup poussé comme un champignon au milieu de mon campus a quand même finalement pas mal changé ma trajectoire de vie. — Alma"},
  'l01':{desc:"École Européenne Supérieure d'Art de Bretagne. Premier site du FabLab rennais depuis février 2012. Ateliers sur tables de ping-pong."},
  'l02':{desc:"Institut Mines-Télécom. Lieu de travail de Baptiste Gaultier, site de production des MOOC FabLab."},
  'l03':{desc:"Collectivité territoriale. Portage institutionnel du LabFab par Norbert Friant puis Romain Chefdor."},
  'l04':{desc:"Espace de coworking et networking numérique à Rennes. Lieu de rencontres informelles au début du LabFab."},
  'l05':{desc:"Équipement culturel rennais. Lieu de la rencontre fondatrice entre Hugues Aubin et John Le Jeune (~2010)."},
  'l06':{desc:"Salle de musiques actuelles. Lieu du festival Jardin Numérique (2011)."},
  'l07':{desc:"FabLab pédagogique de l'Université Rennes 2 (bâtiment T, campus Villejean). Fondé par Pascal Plantard en 2017. Animé par Tony Vanpoucke en CDI. Vivier de monitrices et moniteurs étudiants (notamment depuis la 1ʳᵉ promotion du master création numérique). Vivier de futurs facilitateurs du réseau : Alma y est passée comme usagère puis monitrice avant de devenir facilitatrice à l'EduLab Pasteur. Adaptation pendant le confinement Covid : initiations Arduino en visio sur Tinkercad par Tony."},
  'l08':{desc:"Centre commercial rennais. Scène mythique du TV-B-Gone avec John Le Jeune et Hugues Aubin."},
  'l09':{desc:"Massachusetts Institute of Technology. Référence mondiale des FabLabs (Neil Gershenfeld). Visité par Baptiste et Nicolas."},
  'l10':{desc:"Rassemblement national des FabLabs. AG constitutive du RFF Lab en 2015."},
  'l11':{desc:"Atelier partagé / makerspace rennais."},
  'l12':{desc:"FabLab pédagogique du SUPTICE (Université de Rennes). Animé par Laurent Mattlé (2016), puis Camille Bisson (2021). Open Labs, partenariats universitaires, Lab Tour régional, accompagnement international (UVCI, Côte d'Ivoire). Projets emblématiques : piège à drosophiles (ECOBIO), hackathon plancton."},
  'l13':{desc:"Lieu culturel à Rennes hébergeant Make Me depuis 2022. Lab ouvert au public, concerts, restauration de patrimoine d'art forain.",sources:["Interview JB Le Clec'h"]},
  'l14':{desc:"Association fondée par Nicolas Huchet et Hugues Aubin, née du projet Bionico. Human Lab dédié aux aides techniques pour personnes en situation de handicap.",sources:["Interview Nicolas Huchet","Interview Hugues Aubin","Interview Erwan Mahé","Interview Norbert Friant"]},
  'l15':{desc:"Premier FabLab de France, à Toulouse. Modèle centralisé, contre-exemple de la stratégie décentralisée rennaise.",sources:["Interview JB Le Clec'h","Interview Norbert Friant"]},
  'l16':{desc:"Bâtiment à Rennes hébergeant BUG et espace d'incubation pour My Human Kit avant Askoria.",sources:["Interview Hugues Aubin","Interview Nicolas Huchet","Interview Romain Chefdor"]},
  'l17':{desc:"Centre de recyclage à Rennes. Partenaire Precious Plastic (recyclage PLA). Découpe laser partagée, réparée par l'Élabo.",sources:["Interview Hugues Aubin","Interview Bérangère Amiot"]},
  'l18':{desc:"Hackerspace de Rennes, membre du LabFab étendu. Compétences en réparation de machines. Proche du vivier open source.",sources:["Interview Hugues Aubin"]},
  'l19':{desc:"Association rennaise pionnière fondée par Richard Delogu. Rôle fondateur dans le LabFab : proposition du nom « LabFab », création du site wiki, organisation de Vivacité (2012). Source de tensions lors de l'appel à projet Pellerin (2013) — captation des fonds sans redistribution aux partenaires.",sources:["Interview Hugues Aubin","Interview Nicolas Huchet","Interview Norbert Friant","Interview Laurent Mattlé","Interview Bérangère Amiot"]},
  'e01':{desc:"Moment fondateur du LabFab rennais. Hugues rencontre John au café des Champs-Libres. John sort un oscilloscope open source et un Arduino. Ils vont éteindre les écrans au centre commercial des Trois-Soleils avec un TV-B-Gone.",quote:"« Il m'a parlé de choses dont je ne comprenais absolument rien, en sortant deux objets de sa poche. Le premier, c'était un oscilloscope numérique open source. Le deuxième, c'était une carte Arduino. » — Hugues Aubin"},
  'e02':{desc:"Ouverture du premier FabLab de Rennes dans un local de l'EESAB. Erwan Mahé obtient le local, Odile Le Borgne soutient l'ouverture. Premiers ateliers animés par Baptiste et John sur des tables de ping-pong."},
  'e03':{desc:"Événement citoyen autour du numérique organisé par BUG aux Champs Libres. 10 jours, 60 000 visiteurs. Nicolas Huchet y découvre le FabLab en octobre 2012 — rencontre qui changera sa vie.",quote:"« Hugues m'a envoûté. Je suis rentré chez moi avec plein d'idées en tête. » — Nicolas Huchet"},
  'e04':{desc:"Appel national lancé par Fleur Pellerin et Arnaud Montebourg via la DGE. 250 dossiers déposés, 12 lauréats. LabFab retenu via BUG. Source de tensions durables sur la gestion des 200-300K€."},
  'e05':{desc:"Premier MOOC FabLab sur France Université Numérique par Baptiste Gaultier. Ambition encyclopédique : Arduino, modélisation 3D, découpe laser. Suivi de MOOC hybrides."},
  'e06':{desc:"Nicolas Huchet entre au FabLab pour résoudre un problème concret : sa prothèse le brûle. Il découvre InMoov (Gaël Langevin) et construit une main bionique. Médiatisation France 2, fondation de My Human Kit."},
  'e07':{desc:"Naissance du Réseau Français des FabLabs au festival de Toulouse (AG constitutive). Réponse collective à l'atomisation post-Pellerin. Gouvernance par conseil collégial."},
  'e08':{desc:"L'association LabFab structure la gouvernance du réseau rennais, indépendamment de BUG. Co-présidence Tony + Bérangère. Coïncide avec l'arrivée de Romain Chefdor."},
  'e09':{desc:"Les FabLabs fabriquent masques et visières de manière distribuée pendant le confinement. Preuve de concept pour la fabrication distribuée et le modèle Fab City. Soirées Discord entre makers.",quote:"« Effervescence de fou, pas du tout un confinement tranquille. » — Romain Chefdor"},
  'e10':{desc:"Festival d'arts numériques au Jardin Moderne. Contribution à la diffusion de la culture maker et numérique à Rennes."},
  'e11':{desc:"Document de référence du Réseau Français des FabLabs. Marque le décollage du réseau national. Romain Chefdor y contribue."},
  'e12':{desc:"Marathon créatif urbain facilité par Bérangère Amiot. Croisement entre makers et citoyens autour de problématiques urbaines."},
  'e13':{desc:"Workshop inaugural à Huế, à la Maison des Savoirs. Laurent Mattlé, Baptiste Gaultier et Mariame Labidi contribuent à l'ouverture du premier FabLab du Vietnam avec des cadeaux de la ville de Rennes : imprimante 3D Asimov, kit CNC, kits Arduino. Au retour, Laurent passe par Hô-Chi-Minh-Ville où Hoang-Anh Phan lance le 2e FabLab vietnamien."},
  'e14':{desc:"JB Le Clec'h obtient la licence Maker Faire à San Francisco (2011). Première édition à Saint-Malo, organisée par un groupe d'entrepreneurs dont Berthier Luyt — elle devait initialement se tenir à Rennes. Jusqu'à 10 éditions/an en France.",sources:["Interview JB Le Clec'h","Interview Nicolas Huchet","Interview Norbert Friant","Interview Bérangère Amiot"]},
  'e15':{desc:"Leroy Merlin rachète la licence Maker Faire pour 1M€ (2016). JB perd la licence et crée Make Me en réponse.",sources:["Interview JB Le Clec'h","Interview Nicolas Huchet"]},
  'e16':{desc:"Après la perte de Maker Faire, JB et Jean-Marc créent le Maker Campus en marque propre. Plus grand rassemblement de makers de France : 600 makers/édition.",sources:["Interview JB Le Clec'h","Interview Hugues Aubin"]},
  'e17':{desc:"Événement auquel Make Me participe.",sources:["Interview JB Le Clec'h"]},
  'e18':{desc:"Événement maker organisé par Make Me à Vitré. Les étudiants de l'EduLab y participent régulièrement.",sources:["Interview JB Le Clec'h","Interview Hugues Aubin"]},
  'e19':{desc:"Hackathon organisé par My Human Kit sur la thématique de la cécité, tenu au bâtiment Pasteur (futur EduLab Pasteur) en 2020, en plein Covid. Célia Guye y participe juste après son diplôme à l'EESAB, dans le cadre d'une résidence artistique parallèle. Illustration de la synergie entre makers, designers, patients et chercheurs.",sources:["Interview Célia Guye"],quote:"Cette synergie entre patients — qui ont un savoir expérientiel de la cécité — c'est ça qui était hyper intéressant. — Célia Guye"},
  'e20':{desc:"Conception et fabrication d'un piège à drosophiles asiatiques au Teaching Lab. Le chercheur entomologue d'ECOBIO, formé par Camille Bisson, devient autonome. 100 pièces imprimées en PETG, déployées dans toute la France. Résultat : découverte d'une nouvelle espèce de drosophile asiatique jamais observée en France.",sources:["Interview Camille Bisson"],quote:"Success story complète : formation → autonomie → production → déploiement national → découverte scientifique."},
  'e21':{desc:"Hackathon de deux après-midi au Teaching Lab, organisé par Camille Bisson avec Erwan Vapo et une asso de Marseille. Brassage exceptionnel : étudiants design, étudiants électronique, chercheuse en plancton, ingénieurs pédagogiques, Hugues Aubin, enseignante du secondaire, médiatrice scientifique.",sources:["Interview Camille Bisson"],quote:"Complètement à l'arrache, mais très réussi. — Camille Bisson"},
  'e22':{desc:"Série de hackathons au Fabricarium (Lille) mêlant étudiants en design (dont Célia Guye, alors en 4e année de DNSEP), ingénieurs d'ArianeGroup et acteurs du handicap. Restitutions théâtralisées chaque soir. Événement déclencheur pour Célia : son basculement d'apprentie maker à actrice du milieu.",sources:["Interview Célia Guye","Interview Nicolas Huchet"],quote:"C'était incroyable d'être avec des ingénieurs où chacun, avec nos compétences, on arrivait à mêler. Même moi qui étais étudiante en design, j'ai mis une pierre à l'édifice. — Célia Guye"},
  'e23':{desc:"Ouverture du FabLab municipal de la ville de Rennes au sein du bâtiment Pasteur réhabilité (ancienne école dentaire). Lieu rattaché à la direction éducation enfance, gratuité totale. À l'ouverture, le lieu est encore très peu équipé (Alma s'y rend pour un POCL et le décrit comme « vide même »). Célia Guye y avait fait une résidence artistique en 2020 pendant le Covid, en parallèle du hackathon Focus Vision My Human Kit. Marque le démarrage du nœud Pasteur dans le réseau LabFab.",sources:["Interview Alma","Interview Célia Guye"]},
  'e24':{desc:"Série de fabricatons (hackathons de fabrication) du réseau Audimat (chercheurs en mathématiques) pour développer du matériel pédagogique de vulgarisation scientifique. Camille Bisson y est conviée deux ou trois années de suite : fabricaton organisé à Rennes (~2022), puis réinvitations à Nice et Toulouse. Lien avec la Maison pour la Science.",sources:["Interview Camille Bisson"]},
  'l20':{desc:"FabLab universitaire situé à Lille. Cadre des hackathons ArianeGroup où Célia Guye a découvert le format hackathon et le milieu du handicap maker.",sources:["Interview Célia Guye"]},
  'l21':{desc:"FabLab municipal de la ville de Rennes ouvert en 2021 dans le bâtiment Pasteur réhabilité (ancienne école dentaire de Rennes). Service municipal de la direction éducation enfance. Gratuité totale. Public principal : maternelle moyenne section → CM2. Équipe : 3 facilitateurs et 1 responsable, pas de fab manager. Brassement social fort (quartiers prioritaires, précarité). Axe pédagogique singulier : croisement Plan d'éducation à la nature × Plan numérique éducatif local. Dispositifs : Sylvestre Orchestre, risographie, podcasts.",sources:["Interview Alma","Interview Célia Guye"]},
  'l22':{desc:"FabLab mentionné par Alma sous le nom d'usage « FabLab de Sarah » (orthographe approximative : « petit lave », « Tiny Lab »). Information très partielle dans le corpus. Date de création inconnue — connexion avec l'EduLab Pasteur documentée depuis 2024.",sources:["Interview Alma"]},
  'm01':{desc:"Philosophie fondatrice du LabFab. Partage du code source et des plans de fabrication. Valeur transmise par John Le Jeune."},
  'm02':{desc:"Ressources partagées gérées collectivement. Concept théorisé par Hugues Aubin pour le LabFab étendu."},
  'm03':{desc:"Culture du logiciel et matériel libre. Valeur fondatrice transmise par John Le Jeune et la communauté Arduino."},
  'm04':{desc:"Microcontrôleur open source. Outil pédagogique central des premiers ateliers FabLab, apporté par John Le Jeune."},
  'm05':{desc:"Vision d'une ville autosuffisante grâce à la fabrication distribuée. Portée par Hugues Aubin à Rennes, inspirée par Thomas Diaz."},
  'm06':{desc:"Transmission horizontale des savoirs, sans hiérarchie. Valeur défendue par Nicolas Huchet et Norbert Friant."},
  'm07':{desc:"Capacité d'agir acquise par la pratique. Incarné par Nicolas Huchet, Célia Guye et leurs parcours de transformation."},
  'm08':{desc:"Technologies sobres et accessibles. Défendu par Bérangère Amiot et Laurent Flamant."},
  'm09':{desc:"Pratique de documenter les projets pour les rendre reproductibles. Défendu par Bérangère Amiot et Camille Bisson. Site wiki créé par BUG."},
  'm10':{desc:"Cours en ligne ouverts et massifs. Créés par Baptiste Gaultier sur FUN (2014), puis déclinés en MOOC hybrides."},
  'm11':{desc:"Métier d'animateur de FabLab. Formation structurée par Erwan Mahé. Exercé par Tony, Célia Guye, Camille Bisson, Laurent Mattlé et d'autres."},
  'm12':{desc:"Marathon créatif collaboratif. Facilité par Bérangère Amiot (Maison Mix, Vélo Mix, Métromix)."},
  'm13':{desc:"Festival international des makers. Espace de visibilité et de rencontre pour les FabLabs. Importé en France par JB Le Clec'h (2011), racheté par Leroy Merlin (2016)."},
  'm14':{desc:"Réparer plutôt que jeter. Pratique low-tech promue dans le réseau LabFab."},
  'm15':{desc:"Réutilisation de matériaux et objets. Complémentaire de la réparation et du low-tech."},
  'm16':{desc:"Conception participative impliquant les usagers. Pratiquée par Erwan Mahé à l'EESAB."},
  'm17':{desc:"Fonds Européen de Développement Régional. Financement mobilisé par Norbert Friant pour le réseau."},
  'm18':{desc:"Production décentralisée dans un réseau de FabLabs. Prouvée pendant le Covid (masques, visières)."},
  'm19':{desc:"Projet open source de recyclage du plastique. Pratiqué par Bérangère Amiot."},
  'm20':{desc:"Réseau citoyen de capteurs de qualité de l'air. Animé par Romain Chefdor à Rennes."},
  'm21':{desc:"Do It Yourself — culture du faire soi-même. ADN du mouvement maker et FabLab."},
  'm22':{desc:"Apprendre par la pratique et l'expérimentation. Valeur fondamentale du LabFab, défendue par Norbert Friant et incarnée par Camille Bisson."},
  'm23':{desc:"Engagement bénévole. Bérangère Amiot est la seule bénévole active du réseau LabFab."},
  'm24':{desc:"Enjeu de représentation hommes/femmes dans les FabLabs. Porté par Bérangère Amiot."},
  'm25':{desc:"Processus d'acquisition de compétences et de confiance par la pratique. Proche de l'empowerment."},
  'm26':{desc:"Évolution du mouvement maker vers la réparation, le low-tech et le design frugal. Portée par Bérangère Amiot et Laurent Flamant. Illustrée par le projet piège à drosophiles de Camille Bisson."},
  'm27':{desc:"Accessibilité numérique et accueil de publics fragiles : quartiers prioritaires, précarité, personnes à la rue. Incarnée par l'EduLab Pasteur (gratuité, brassement social) et par My Human Kit (handicap). Position militante revendiquée par Alma."},
  'm28':{desc:"Articulation délibérée entre éducation à la nature et éducation au numérique pour s'opposer à leur opposition fréquente. Axe pédagogique de l'EduLab Pasteur (croisement Plan d'éducation à la nature × Plan numérique éducatif local de la ville de Rennes). Dispositifs : Sylvestre Orchestre (faire chanter les plantes), risographie avec matériaux ramassés, podcasts en extérieur."},
  'a26':{desc:"Quentin Orant, maker, développeur et artiste indépendant « entre écologie et numérique », retrace un parcours atypique : formation en énergie/environnement, médiation scientifique à l'Espace des sciences, photographie argentique et street art (collectif Indien dans la Ville / IDLV), avant une découverte fortuite du FabLab des Beaux-Arts vers 2013. De là naît une conviction — associer ressourcerie et FabLab — qui donnera l'Atelier commun puis, après fusion, l'atelier de la Belle Déchette à la Courrouze. L'entretien articule une trajectoire personnelle d'*empowerment* par l'essai-erreur, un engagement écologie-réemploi comme facteur de différenciation, et une critique lucide du réseau LabFab pris entre esprit punk et tutelle institutionnelle de Rennes Métropole.",role:["Cofondateur et ex-coordinateur de l'Atelier commun","Formateur des salariés de la Belle Déchette (« fab manager distribué »)","Pionnier de l'axe écologie-réemploi à Rennes","Défenseur du financement public (« les FabLabs, comme une bibliothèque »)"],sources:["Interview directe"],quote:"« Tu peux le vendre avec ce côté technique numérique, et en loucedé, tu vas faire de l'éducation populaire. »"},
  'a27':{desc:"Joden Morand, aujourd'hui coordinatrice de l'EUR CAPS (?) (Rennes 2, approches créatives à l'espace public), était <strong>chargée de communication à l'EESAB</strong> au moment de la création du LabFab des Beaux-Arts (~2012). Témoin <strong>extérieur et non-makeuse</strong>, elle apporte un point de vue rare sur le corpus : celui de la personne chargée de <strong>traduire</strong> un objet nouveau et incompréhensible (« un LabFab, c'est quoi ? ») pour les étudiants, les enseignants et le grand public. Elle décrit la « table » des acteurs au lancement, la recette d'un projet qui marche (passionnés + appui politique + besoins), l'esprit punk toléré dans l'institution, et livre sa version de l'anecdote du TV-B-Gone.",role:["Communication du lancement du LabFab EESAB (interne puis grand public)","Traductrice entre passionnés et grand public","Regard extérieur / institutionnel sur la genèse"],sources:["Interview directe"],quote:"« À chaque fois que quelqu'un rentrait dans ce labo, il en ressortait avec des étoiles dans les yeux. »"},
  'a28':{desc:"Sœur de Quentin Orant, formée à la gestion des déchets (services déchets de Rennes Métropole, Fougères). Cofondatrice de la ressourcerie La Belle Déchette et du modèle ressourcerie + FabLab. Mène dialogue et rapport de force avec les partenaires institutionnels pour financer des postes.",role:["Cofondatrice de la Belle Déchette","Versant ressourcerie du modèle écologie-réemploi","Combat pour le financement public des postes"],sources:["Interview Quentin Orant"]},
  'l23':{desc:"Atelier associatif dédié à l'écologie et au réemploi, cofondé par Quentin Orant, accolé à la ressourcerie Belle Déchette (ZI Sud-Est de Rennes, ~2016). Ouvert au public en 2019. Premier atelier rennais à assumer un positionnement écologie-réemploi ; équipement atypique (bois-métal, machines à coudre, labo argentique, CNC DIY, Precious Plastic). Fusionné avec la Belle Déchette (~2022).",sources:["Interview Quentin Orant"]},
  'l24':{desc:"Lieu en préfiguration à la Courrouze (Rennes), construit selon la méthode de permanence architecturale. Nouvel ancrage de la Belle Déchette et de son atelier après la fusion (~2022). Lieu de projets art/numérique/écologie (installation musique-plantes de Quentin Orant sur le seul arbre du site).",sources:["Interview Quentin Orant"]},
  'l25':{desc:"FabLab du quartier du Blosne à Rennes. Proche géographiquement de l'Atelier commun, avec qui des collaborations avaient été envisagées.",sources:["Interview Quentin Orant"]},
  'l26':{desc:"FabLab / atelier mobile du réseau rennais (animé notamment par Sarah), cité par Romain Chefdor et par Quentin Orant (collaborations ponctuelles).",sources:["Interview Quentin Orant","Interview Romain Chefdor"]},
  'l27':{desc:"Collectif artistique pluridisciplinaire cofondé par Quentin Orant vers 2012 (existe encore). Explore l'espace public, l'éducation populaire et l'écologie. Connu pour ses projections de silhouettes d'Indiens sur les façades du centre de Rennes (festival de photographie « L'Image publique », dalle du Colombier) — un positionnement dont Quentin assume aujourd'hui mal le côté appropriation culturelle. C'est via l'IDLV et son robot dessinant (drawbot pendulaire inspiré de Polargraph, résidence à l'Hôtel Pasteur, Festival Maintenant) que Quentin bascule vers la fabrication numérique et les FabLabs.",sources:["Interview Quentin Orant"]},
  'e25':{desc:"Après une résidence à l'Hôtel Pasteur, le collectif IDLV obtient l'appel à projet « Art & Technologie » du Festival Maintenant et y présente son robot dessinant (drawbot inspiré de Polargraph). Étape du basculement de Quentin Orant vers la fabrication numérique.",sources:["Interview Quentin Orant"]},
  'e26':{desc:"L'Atelier commun obtient le budget participatif de la Ville de Rennes (Fabrique Citoyenne) pour fabriquer des machines Precious Plastic de recyclage plastique, en réemploi, avec deux classes de BTS du lycée Joliot-Curie.",sources:["Interview Quentin Orant"]},
  'e27':{desc:"Ouverture au public de l'Atelier commun après trois ans d'expérimentation. ~100 adhérents, OpenLab hebdomadaire. Quentin Orant devient salarié coordinateur. Immédiatement suivie du Covid.",sources:["Interview Quentin Orant"]},
  'e28':{desc:"Après le départ (épuisement) de Quentin de la coordination, l'Atelier commun est repris par la Belle Déchette : les deux associations fusionnent et l'atelier déménage à la Courrouze. Émergence du modèle de fab manager distribué entre salariés de la ressourcerie.",sources:["Interview Quentin Orant"]},
  'm29':{desc:"Structure de collecte, réparation et revente d'objets de seconde main. Couplée à un FabLab dans le modèle écologie-réemploi porté par Quentin Orant et Julie (Atelier commun, Belle Déchette)."},
  'm30':{desc:"Croisement des savoirs (artistes, ingénieurs, designers) au cœur de l'ADN du LabFab. Mise en avant par Joden Morand comme la « vision » des fondateurs — de la co-conception avant l'heure."},
  // === Ajouts interview Tony Vanpoucke ===
  'a29':{desc:"Enseignant en art numérique à l'Université Rennes 2. Débloque la salle dans laquelle Thomas Meij ouvre un premier petit FabLab, avant l'EduLab — brique du « background » sur lequel s'appuiera le dossier FEDER. Suivait le projet EduLab de loin, comme David Puzos. Co-monte une licence professionnelle de design numérique avec l'EESAB. Défend une distinction stricte entre art et technique.",role:["Débloque la salle du premier FabLab de Rennes 2","Enseignant « en conseil » sur le projet EduLab","Permanences du jeudi matin à l'EduLab"],sources:["Interview Tony Vanpoucke","Interview Alma","Interview Erwan Mahé"],quote:"« Ce que tu es en train de faire, ce n'est pas de l'art, c'est de la technique. Donc la technique, tout le monde l'a. »"},
  'a30':{desc:"NOM NON CONFIRMÉ (transcription automatique, à vérifier). Enseignant à l'Université Rennes 2, à l'origine de l'ouverture du premier FabLab de Rennes 2 (~2015) et acteur du montage du projet EduLab. C'est lui qui propose à Tony l'échange de bons procédés fondateur : ateliers gratuits contre accès aux machines.",role:["Enseignant référent du FabLab de Rennes 2 à son ouverture","Cité parmi les initiateurs du projet EduLab, « plutôt en conseil »","Porte la pression du financement FEDER avant la création du poste"],sources:["Interview Tony Vanpoucke"],quote:"« Il m'avait dit : ah bah, on peut faire ce genre d'échange, c'est possible. »"},
  'a31':{desc:"NOM NON CONFIRMÉ (transcription automatique, à vérifier). Cité comme l'un des initiateurs du projet EduLab à l'Université Rennes 2, aux côtés de Pascal Plantard, du réseau LabFab et de David Puzos. Aucune autre information disponible dans le corpus à ce stade.",role:["Co-initiateur du montage du projet EduLab et de son dossier FEDER"],sources:["Interview Tony Vanpoucke"]},
  'a32':{desc:"NOM NON CONFIRMÉ (transcription automatique, à vérifier). Ancien président du réseau LabFab, aujourd'hui enseignant en médecine. Maillon de cooptation décisif : c'est son SMS du dimanche qui fait entrer Tony — et donc l'EduLab — dans le réseau de fabrication distribuée du premier confinement.",role:["Président du réseau LabFab jusqu'à peu avant le Covid","Déclencheur de l'entrée de l'EduLab dans le réseau visières"],sources:["Interview Tony Vanpoucke"],quote:"« Salut Tony, t'as des imprimantes 3D, amène-toi dimanche à 14 h. »"},
  'a33':{desc:"NOM NON CONFIRMÉ (transcription automatique, à vérifier). Volontaire en service civique à l'EduLab avant la création du poste de fab manager. Figure de la période pré-professionnelle du lieu : fermetures à 22 h, trajets vers Nantes, pas d'open lab encadré. Sa situation cristallise le diagnostic qui mènera au recrutement d'un poste pérenne.",role:["Assure seule l'ouverture quotidienne de l'EduLab avant 2017","Cas d'école de l'insuffisance du service civique comme mode d'animation"],sources:["Interview Tony Vanpoucke"],quote:"« Ne finis pas trop tard, ne te fais pas bouffer. Ou alors attends, je prends ta place ce soir. » — Tony"},
  'a34':{desc:"PRÉNOMS NON CONFIRMÉS (transcription automatique, à vérifier). Couple de menuisiers rennais, coordinateurs de fait du réseau de collecte et de distribution des visières pendant le premier confinement, via le collectif « Couturiers masqués ». Très liés à Comme un Établi. Marine sera ensuite auditionnée par l'ARS nationale.",role:["Animent le collectif Couturiers masqués","Organisent la logistique de récolte des visières (tableau partagé, ramassage à vélo)","Incarnent la communauté souterraine que les FabLabs institutionnels découvrent"],sources:["Interview Tony Vanpoucke"],quote:"« C'était juste un couple qui se marrait à faire ça parce qu'ils se sentaient utiles. » — Tony"},
  'l28':{desc:"MJC rennaise dotée d'un EPN équipé en imprimantes 3D dans le cadre de la politique du LabFab étendu. Ni FabLab officiel ni tiers-lieu : un « lieu relais de la fabrication numérique », et un cas d'école de la réussite de cette politique. Héberge longtemps le bureau de Milo Carré, donc de Tony à ses débuts.",role:["Relais du LabFab étendu, équipé grâce à la politique poussée par BUG","Lieu où Tony se forme réellement à l'impression 3D, comme usager qui dépanne","Point d'accroche entre des statuts très différents (animateur en CDI / jeunes diplômés précaires)"],sources:["Interview Tony Vanpoucke"],quote:"« Ça, on n'aurait pas pu l'avoir sans ce programme-là, qui vient du LabFab aussi. »"},
  'l29':{desc:"NOM NON CONFIRMÉ (transcription automatique, à vérifier). Association rennaise d'art numérique pour les enfants, premier employeur de Tony Vanpoucke. Pionnière en France sur ce créneau selon lui. C'est la structure par laquelle il bascule de la théorie à la pratique technique, et le lieu de sa première documentation partagée.",role:["Art numérique pour enfants ; auto-formation collective à Arduino","Bureau au Grand Cordel, dont l'EPN devient terrain d'apprentissage","L'équipe se retrouve dans le réseau visières pendant le Covid"],sources:["Interview Tony Vanpoucke"],quote:"« Ils se disent : on a fait tout ça, on a fait de la soudure, on a 8 ans. »"},
  'l30':{desc:"Makerspace commercial fréquenté par Tony avant son arrivée à Rennes (enseigne partenaire donnée de mémoire, à confirmer). CONTRE-EXEMPLE CENTRAL DU CORPUS : un lieu où la pratique existait pleinement — découpe laser à 5 €, chutes de matière du magasin — mais où la communauté n'a jamais pu se former, parce que le lieu était pensé comme un service.",role:["Contre-modèle du FabLab : la pratique sans la communauté","Fonde la distinction « serviciel / communautaire » que Tony maintient tout au long de l'entretien"],sources:["Interview Tony Vanpoucke"],quote:"« Les gens parlaient un peu, mais ils n'étaient pas invités à le faire. »"},
  'l31':{desc:"FabLab breton, membre du réseau breton LabBZH des débuts. Tony le cite comme le cas qui l'a fait nuancer sa propre doctrine sur les modèles payants : il conseille de ne pas facturer les machines, avant de découvrir que Lannion le fait depuis toujours, à des prix honnêtes.",role:["Membre historique du réseau breton (avec Auray, Rennes, Brest)","Cas qui assouplit la doctrine de Tony : le modèle importe moins que l'appartenance au commun"],sources:["Interview Tony Vanpoucke"],quote:"« Ils ont trouvé leur équilibre comme ça. Ils font du commun, on discute ensemble, et on voit qu'ils font partie de cette grande famille. »"},
  'e29':{desc:"Ouverture du FabLab universitaire de Rennes 2 grâce à un financement FEDER, et recrutement de Tony Vanpoucke sur le premier poste pérenne de fab manager du lieu. Le projet du LabFab prévoyait d'équiper PLUSIEURS lieux existants ; le FEDER a finalement été concentré sur un seul. Cet écart fonde la réputation durable « Rennes 2 a récupéré le gâteau ».",role:["Initiateurs : Pascal Plantard, Anthony Offray, le LabFab, David Puzos","Dossier appuyé sur du préexistant : le petit FabLab de Thomas Meij, salle débloquée par Joël Laurent","Pensé en combo avec la formation DU ÉTIC (décrochage scolaire, « fierté du faire », pouvoir d'agir)","Accès extérieur pensé dès la construction pour permettre l'autogestion, sur recommandation des Beaux-Arts","Revers : le FEDER ne dure que 4 ans, le poste est ensuite menacé"],sources:["Interview Tony Vanpoucke"],quote:"« C'est un peu Rennes 2 qui a récupéré le gâteau et qui ne l'a pas énormément partagé. »"},
  'e30':{desc:"NOM DE DOMAINE NON CONFIRMÉ (à vérifier sur les archives du premier site du LabFab). Réseau régional des FabLabs bretons créé très tôt par Hugues Aubin : Lannion, Auray, Rennes, Brest, probablement Vannes, avec des liens plus distants vers Ping (Nantes). Son dernier survivant, le MIBS (Maker in Bretagne Sud), est en silence radio depuis peu avant le Covid.",role:["Échelon régional manquant entre le LabFab rennais et le RFFLabs","Mutualisme matériel des débuts : prêt d'imprimantes 3D entre labs bretons","S'est distendu : la localité l'emporte, et le RFFLabs a pris la place des réseaux à distance intermédiaire"],sources:["Interview Tony Vanpoucke"],quote:"« C'est une mine d'or pour comprendre comment ça marchait. »"},
  'e31':{desc:"DATE NON SOURCÉE dans l'entretien (placée ici à 2025, à confirmer). Hackathon organisé à l'Opéra de Rennes, pour lequel l'EduLab a monté un FabLab éphémère sur place, tenu par trois étudiants, Tony restant volontairement en retrait. L'effet observé dépasse ses attentes.",role:["FabLab éphémère à l'Opéra, tenu par trois étudiants","Passation complète : « on leur a donné les clés de la boutique »","Illustre l'appartenance par la prise de responsabilité, pas par la fréquentation"],sources:["Interview Tony Vanpoucke"],quote:"« Ce truc-là, ça m'a fait sentir appartenir totalement à ça. » — un des étudiants"},
  'e32':{desc:"Échange entre l'EduLab Rennes 2 et le FabLab d'Erlangen (Allemagne), emmenant de jeunes makers rencontrer leurs homologues allemands. Expérience la plus marquante de l'année pour Tony, et prototype d'échanges « peut-être un peu pérennes ». Le FabLab d'Erlangen entretient déjà des liens avec le réseau rennais (cf. le participant annuel cité par JB Le Clec'h).",role:["Mobilité étudiante comme fabrique d'appartenance","Effet observé : montée en confiance et projets de tiers-lieux chez les étudiants"],sources:["Interview Tony Vanpoucke","Interview Jean-Baptiste Le Clec'h"],quote:"« J'ai vu que les gens font autrement ailleurs. En termes de confiance en toi, ça monte en flèche. »"},
  'm31':{desc:"Thème transversal formalisé par l'interview de Tony (thème 13 de la synthèse croisée). La question n'est plus « qu'est-ce qu'un FabLab » mais « à partir de quand en fait-on partie ». Le critère de Tony : on appartient à partir du moment où l'on a CONTRIBUÉ — sa première documentation partagée, et non sa première visite ni son embauche.",role:["Conséquence opérationnelle : donner une « prise » à chacun (une mission, un secrétariat, un pré carré)","Corollaire terminologique : le mot « maker » reste un obstacle, anglicisme sans traduction","Rejoint Célia (syndrome de l'imposteur), Alma (usagère → pro) et Quentin"],sources:["Interview Tony Vanpoucke","Interview Célia Guye","Interview Alma"],quote:"« C'est quand j'ai commencé à faire une doc que je me suis dit : ça y est, j'ai repartagé un truc. »"},
};

// ===== STATE =====
const activeCategories = new Set(['Acteur','Lieu','Événement','Mot-clé']);
let timeRange = [2009, 2026];
let searchQuery = '';
let selectedNodeId = null;
let hoveredNodeId = null;

// ===== HELPERS =====
const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);

const adjacency = {};
nodes.forEach(n => adjacency[n.id] = []);
edges.forEach(e => {
  adjacency[e.source].push({target:e.target, label:e.label});
  adjacency[e.target].push({target:e.source, label:e.label});
});

function nid(d) { return (typeof d === 'object') ? d.id : d; }

function isNodeVisible(n) {
  if (!activeCategories.has(n.cat)) return false;
  if (n.y2 < timeRange[0] || n.y1 > timeRange[1]) return false;
  if (searchQuery && !n.label.toLowerCase().includes(searchQuery)) return false;
  return true;
}

function nodeOpacity(n) {
  if (!isNodeVisible(n)) return 0.04;
  if (hoveredNodeId) {
    const conn = new Set(adjacency[hoveredNodeId].map(a => a.target));
    conn.add(hoveredNodeId);
    return conn.has(n.id) ? 1 : 0.08;
  }
  if (selectedNodeId) {
    const conn = new Set(adjacency[selectedNodeId].map(a => a.target));
    conn.add(selectedNodeId);
    return conn.has(n.id) ? 1 : 0.2;
  }
  return 0.85;
}

// Étiquettes adaptatives : les petits nœuds ne sont étiquetés qu'en zoom rapproché
function labelZoomFactor(d) {
  if (d.size >= 14) return 1;
  if (d.size >= 10) return zoomK >= 0.65 ? 1 : 0;
  return zoomK >= 1.1 ? 1 : 0;
}

function labelOpacity(d) {
  const op = nodeOpacity(d);
  const base = op > 0.5 ? 0.75 : op > 0.1 ? op * 0.8 : 0;
  if (op === 1) return base; // nœud en focus (survol/sélection) : toujours lisible
  return base * labelZoomFactor(d);
}

function edgeOpacity(e) {
  const sid = nid(e.source), tid = nid(e.target);
  const sn = nodeMap[sid], tn = nodeMap[tid];
  if (!sn || !tn || !isNodeVisible(sn) || !isNodeVisible(tn)) return 0;
  if (hoveredNodeId) return (sid===hoveredNodeId||tid===hoveredNodeId) ? 0.5 : 0.01;
  if (selectedNodeId) return (sid===selectedNodeId||tid===selectedNodeId) ? 0.3 : 0.02;
  return 0.07;
}

function edgeColor(e) {
  const sid = nid(e.source), tid = nid(e.target);
  if (hoveredNodeId && (sid===hoveredNodeId||tid===hoveredNodeId)) {
    return catConfig[nodeMap[hoveredNodeId].cat].color;
  }
  if (selectedNodeId && (sid===selectedNodeId||tid===selectedNodeId)) {
    return catConfig[nodeMap[selectedNodeId].cat].color;
  }
  return '#ffffff';
}

// ===== LAYOUT DIMENSIONS =====
let W, H;
function updateDimensions() {
  W = window.innerWidth;
  H = window.innerHeight - 56 - 80;
}
updateDimensions();

// Initialize positions
nodes.forEach(n => {
  const c = catConfig[n.cat];
  const spread = Math.min(W, H) * 0.22;
  n.x = W/2 + c.cx * W + (Math.random() - 0.5) * spread;
  n.y = H/2 + c.cy * H + (Math.random() - 0.5) * spread;
});

// ===== SVG SETUP =====
const svg = d3.select('#main-svg').attr('width', W).attr('height', H);
const g = svg.append('g');

let zoomK = 1;
const zoom = d3.zoom().scaleExtent([0.2, 5]).on('zoom', e => {
  g.attr('transform', e.transform);
  const k = e.transform.k;
  if (Math.abs(k - zoomK) > 0.04) {
    zoomK = k;
    labels.attr('opacity', d => labelOpacity(d));
  } else {
    zoomK = k;
  }
});
svg.call(zoom);

// Fond étoilé — fixe (hors zoom), statique sauf 1 étoile sur 6 qui scintille en CSS
const starGroup = svg.insert('g', 'g').attr('pointer-events','none');
starGroup.selectAll('circle').data(d3.range(140)).join('circle')
  .attr('cx', () => Math.random()*W).attr('cy', () => Math.random()*H)
  .attr('r', () => 0.4 + Math.random()*1.1)
  .attr('fill','#fff').attr('opacity', () => 0.05 + Math.random()*0.2)
  .attr('class', (d,i) => i%6===0 ? 'star-twinkle' : null)
  .style('animation-delay', (d,i) => i%6===0 ? ((i%30)*0.35)+'s' : null);
window.zoomIn = () => svg.transition().duration(300).call(zoom.scaleBy, 1.4);
window.zoomOut = () => svg.transition().duration(300).call(zoom.scaleBy, 0.7);
window.resetZoom = () => svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);

// Background zones — radial gradient clouds
const defs = svg.append('defs');
const zoneGroup = g.append('g');
Object.entries(catConfig).forEach(([key, c], i) => {
  const grad = defs.append('radialGradient')
    .attr('id', 'zgrad-'+i)
    .attr('cx','50%').attr('cy','50%').attr('r','50%');
  grad.append('stop').attr('offset','0%').attr('stop-color',c.color).attr('stop-opacity',0.10);
  grad.append('stop').attr('offset','45%').attr('stop-color',c.color).attr('stop-opacity',0.05);
  grad.append('stop').attr('offset','100%').attr('stop-color',c.color).attr('stop-opacity',0);

  const cx = W/2 + c.cx * W, cy = H/2 + c.cy * H;
  const rx = W*0.38, ry = H*0.44;
  zoneGroup.append('ellipse').attr('cx',cx).attr('cy',cy).attr('rx',rx).attr('ry',ry)
    .attr('fill','url(#zgrad-'+i+')').attr('stroke','none');
  zoneGroup.append('text').attr('x',cx).attr('y',cy-ry*0.55).attr('text-anchor','middle')
    .attr('fill',c.color).attr('opacity',0.18).attr('font-size',14).attr('font-weight',700)
    .attr('letter-spacing',3).text(c.label);
});

// Edges
const edgeGroup = g.append('g');
const edgeLines = edgeGroup.selectAll('path').data(edges).join('path')
  .attr('fill','none').attr('stroke-linecap','round')
  .attr('stroke','#fff').attr('stroke-opacity',0.07).attr('stroke-width',d => d.w*0.5);

// Node group
const nodeGroup = g.append('g');

// Glow circles
const nodeGlow = nodeGroup.selectAll('.glow').data(nodes).join('circle')
  .attr('class','glow').attr('r',d => d.size*1.6)
  .attr('fill',d => catConfig[d.cat].color).attr('fill-opacity',0).attr('pointer-events','none');

// Selection ring
const nodeRing = nodeGroup.selectAll('.ring').data(nodes).join('circle')
  .attr('class','ring').attr('r',d => d.size*0.7+4)
  .attr('fill','none').attr('stroke','#fff').attr('stroke-width',2)
  .attr('stroke-opacity',0).attr('pointer-events','none');

// Main circles
const nodeCircles = nodeGroup.selectAll('.node').data(nodes).join('circle')
  .attr('class','node').attr('r',d => d.size*0.7)
  .attr('fill',d => catConfig[d.cat].color).attr('fill-opacity',0.85)
  .attr('stroke',d => catConfig[d.cat].color).attr('stroke-width',1.5).attr('stroke-opacity',0.3)
  .attr('cursor','pointer');

// Labels
const labelGroup = g.append('g');
const labels = labelGroup.selectAll('text').data(nodes).join('text')
  .text(d => d.label)
  .attr('fill','#fff').attr('font-size',d => Math.max(9, d.size*0.55))
  .attr('paint-order','stroke').attr('stroke','#0f0f1a')
  .attr('stroke-width',2.5).attr('stroke-linejoin','round')
  .attr('text-anchor','middle').attr('dy',d => d.size*0.7+13)
  .attr('opacity',0.65).attr('pointer-events','none');

// ===== FORCE SIMULATION =====
const simulation = d3.forceSimulation(nodes)
  .force('charge', d3.forceManyBody().strength(-160))
  .force('collide', d3.forceCollide().radius(d => d.size*0.9+8))
  .force('x', d3.forceX(d => W/2 + catConfig[d.cat].cx * W).strength(0.14))
  .force('y', d3.forceY(d => H/2 + catConfig[d.cat].cy * H).strength(0.14))
  .force('link', d3.forceLink(edges.filter(e => {
    const s = nodeMap[e.source.id||e.source], t = nodeMap[e.target.id||e.target];
    return s && t && s.cat === t.cat;
  })).id(d => d.id).strength(0.06).distance(80))
  .alphaDecay(0.02)
  .on('tick', tick);

function tick() {
  edgeLines.attr('d', d => {
    const s = nodeMap[nid(d.source)]||d.source, t = nodeMap[nid(d.target)]||d.target;
    const mx = (s.x + t.x)/2 - (t.y - s.y)*0.12;
    const my = (s.y + t.y)/2 + (t.x - s.x)*0.12;
    return `M${s.x},${s.y} Q${mx},${my} ${t.x},${t.y}`;
  });
  nodeCircles.attr('cx',d=>d.x).attr('cy',d=>d.y);
  nodeGlow.attr('cx',d=>d.x).attr('cy',d=>d.y);
  nodeRing.attr('cx',d=>d.x).attr('cy',d=>d.y);
  labels.attr('x',d=>d.x).attr('y',d=>d.y);
}

// Pop d'apparition d'un nœud (lecture automatique de la timeline)
function popNode(id) {
  nodeCircles.filter(d => d.id === id)
    .attr('r', d => d.size*0.12)
    .transition('pop').duration(650).ease(d3.easeBackOut.overshoot(2.4))
    .attr('r', d => d.size*0.7);
  nodeGlow.filter(d => d.id === id)
    .attr('fill-opacity', 0.5)
    .transition('popglow').duration(950).ease(d3.easeCubicOut)
    .attr('fill-opacity', 0);
}

// Drag
nodeCircles.call(d3.drag()
  .on('start',(e,d)=>{if(!e.active)simulation.alphaTarget(0.08).restart();d.fx=d.x;d.fy=d.y;})
  .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
  .on('end',(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null;})
);


// ===== MASTER UPDATE =====
function updateVisibility() {
  // 2D update
  nodeCircles.transition().duration(250)
    .attr('fill-opacity',d => nodeOpacity(d))
    .attr('pointer-events',d => isNodeVisible(d) ? 'all' : 'none');
  labels.transition().duration(250)
    .attr('opacity',d => labelOpacity(d));
  edgeLines.transition().duration(250)
    .attr('stroke-opacity',d => edgeOpacity(d))
    .attr('stroke',d => edgeColor(d));
  nodeGlow.attr('fill-opacity',d => d.id===hoveredNodeId ? 0.15 : 0);
  nodeRing.attr('stroke-opacity',d => d.id===selectedNodeId ? 0.6 : 0)
    .classed('ring-pulse', d => d.id===selectedNodeId);
}
// ===== TOOLTIP =====
const tooltip = document.getElementById('tooltip');

nodeCircles.on('mouseenter',(event,d) => {
  if (!isNodeVisible(d)) return;
  hoveredNodeId = d.id;
  updateVisibility();
  // Survol : uniquement le nom. Le détail est réservé au clic (panneau latéral).
  tooltip.textContent = d.label;
  tooltip.style.borderLeftColor = catConfig[d.cat].color;
  tooltip.style.opacity = 1;
})
.on('mousemove',event => {
  const panelOpen = document.getElementById('panel').classList.contains('open');
  const maxX = window.innerWidth - (panelOpen ? 380 : 0) - tooltip.offsetWidth - 12;
  tooltip.style.left = Math.min(event.pageX+16, maxX) + 'px';
  tooltip.style.top = (event.pageY-10) + 'px';
})
.on('mouseleave',() => {
  hoveredNodeId = null;
  updateVisibility();
  tooltip.style.opacity = 0;
});

// ===== CLICK → PANEL =====
nodeCircles.on('click',(event,d) => {
  if (!isNodeVisible(d)) return;
  event.stopPropagation();
  selectNode(d.id);
});

svg.on('click',() => closePanel());

function selectNode(id) {
  selectedNodeId = id;
  updateVisibility();
  openPanel(id);
}

function closePanel() {
  selectedNodeId = null;
  document.getElementById('panel').classList.remove('open');
  updateVisibility();
}

function openPanel(id) {
  const n = nodeMap[id];
  const det = details[id] || {};
  const panel = document.getElementById('panel');
  const content = document.getElementById('panel-content');
  const c = catConfig[n.cat];

  let html = '';
  html += `<div class="panel-badge" style="background:${c.color}22;color:${c.color}">${n.cat}</div>`;
  html += `<h2>${n.label}</h2>`;
  html += `<span class="panel-period">${n.y1}</span>`;
  if (det.desc) html += `<p class="panel-desc">${det.desc}</p>`;
  if (det.quote) html += `<div class="panel-quote">${det.quote}</div>`;

  if (det.role && det.role.length) {
    html += `<div class="panel-section"><h3>Rôle dans le LabFab</h3><ul>`;
    det.role.forEach(r => html += `<li>${r}</li>`);
    html += `</ul></div>`;
  }

  if (det.sources && det.sources.length) {
    html += `<div class="panel-section"><h3>Sources</h3><ul>`;
    det.sources.forEach(s => html += `<li>${s}</li>`);
    html += `</ul></div>`;
  }

  content.innerHTML = html;
  panel.classList.add('open');
}

// ===== SEARCH =====
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase().trim();
  updateVisibility();
});

// ===== CATEGORY FILTERS =====
const legend = document.getElementById('legend');
Object.entries(catConfig).forEach(([cat, conf]) => {
  const count = nodes.filter(n => n.cat === cat).length;
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.dataset.cat = cat;
  btn.innerHTML = `<span class="dot" style="background:${conf.color}"></span>${cat}<span class="count">${count}</span>`;
  btn.addEventListener('click', () => {
    if (activeCategories.has(cat)) {
      activeCategories.delete(cat);
      btn.classList.add('inactive');
    } else {
      activeCategories.add(cat);
      btn.classList.remove('inactive');
    }
    updateVisibility();
  });
  legend.appendChild(btn);
});

// ===== TIMELINE =====
(function initTimeline() {
  const container = document.getElementById('timeline');
  const tsvg = d3.select('#timeline-svg');
  const margin = {left:60, right:60, top:28, bottom:20};
  const tw = container.clientWidth - margin.left - margin.right;
  const th = 80 - margin.top - margin.bottom;

  const xScale = d3.scaleLinear().domain([2009, 2026]).range([0, tw]);
  const tg = tsvg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);

  // Axis
  const axis = d3.axisBottom(xScale).ticks(18).tickFormat(d3.format('d')).tickSize(th);
  tg.append('g').attr('class','axis').call(axis).select('.domain').remove();

  // Event markers
  const events = nodes.filter(n => n.cat === 'Événement');
  tg.selectAll('.ev-mark').data(events).join('circle')
    .attr('class','ev-mark')
    .attr('cx', d => xScale((d.y1+d.y2)/2))
    .attr('cy', th/2)
    .attr('r', 4)
    .attr('fill', catConfig['Événement'].color)
    .attr('fill-opacity', 0.6)
    .attr('cursor','pointer')
    .on('mouseenter', (event,d) => {
      tooltip.textContent = d.label;
      tooltip.style.borderLeftColor = catConfig['Événement'].color;
      tooltip.style.opacity = 1;
      tooltip.style.left = (event.pageX+10)+'px';
      tooltip.style.top = (event.pageY-40)+'px';
    })
    .on('mouseleave', () => { tooltip.style.opacity = 0; })
    .on('click', (event,d) => { event.stopPropagation(); selectNode(d.id); });

  // Brush
  const brush = d3.brushX()
    .extent([[0, 0],[tw, th]])
    .on('brush end', ({selection}) => {
      if (selection) {
        timeRange = selection.map(xScale.invert).map(Math.round);
      } else {
        timeRange = [2009, 2026];
      }
      updateVisibility();
    });

  const brushG = tg.append('g').attr('class','brush').call(brush);
  brushG.call(brush.move, [xScale(2009), xScale(2026)]);

  // ===== AUTOPLAY =====
  let playing = false;
  let playInterval = null;
  let playCursor = 2009;
  const playSpeed = 180;
  const playStep = 0.15;
  const playBtn = document.getElementById('play-btn');
  const yearLabel = document.getElementById('timeline-year');

  let bornSet = new Set();
  function playTick() {
    playCursor += playStep;
    if (playCursor >= 2026) {
      playCursor = 2009;
      bornSet = new Set();
    }
    brushG.call(brush.move, [xScale(2009), xScale(playCursor)]);
    yearLabel.textContent = Math.floor(playCursor);
    // Pop des nœuds qui « naissent » dans la période courante
    nodes.forEach(n => {
      if (!bornSet.has(n.id) && isNodeVisible(n)) {
        bornSet.add(n.id);
        if (n.y1 > 2009) popNode(n.id);
      }
    });
  }

  function startPlay() {
    playing = true;
    playBtn.textContent = '⏸';
    playBtn.classList.add('playing');
    yearLabel.classList.add('visible');
    playCursor = 2009;
    bornSet = new Set();
    playTick();
    playInterval = setInterval(playTick, playSpeed);
  }

  function stopPlay() {
    playing = false;
    playBtn.textContent = '▶';
    playBtn.classList.remove('playing');
    yearLabel.classList.remove('visible');
    if (playInterval) { clearInterval(playInterval); playInterval = null; }
    brushG.call(brush.move, [xScale(2009), xScale(2026)]);
  }

  window.togglePlay = function() {
    if (playing) stopPlay(); else startPlay();
  };
})();

// ===== KEYBOARD =====
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (selectedNodeId) closePanel();
    if (searchQuery) { searchInput.value = ''; searchQuery = ''; updateVisibility(); }
    searchInput.blur();
  }
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
});

// ===== RESIZE =====
window.addEventListener('resize', () => {
  updateDimensions();
  svg.attr('width', W).attr('height', H);
  starGroup.selectAll('circle').attr('cx', () => Math.random()*W).attr('cy', () => Math.random()*H);
  simulation.force('x', d3.forceX(d => W/2 + catConfig[d.cat].cx * W).strength(0.14));
  simulation.force('y', d3.forceY(d => H/2 + catConfig[d.cat].cy * H).strength(0.14));
  simulation.alpha(0.3).restart();
});
